name: Deploy web (Firebase Hosting)

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

# A deploy must never be cancelled mid-flight, so unlike CI this group does not
# cancel in progress: a queued deploy is fine, a half-finished one is not.
concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Firebase Hosting (production)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build and test the site
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build

      # Needs one repository secret: FIREBASE_SERVICE_ACCOUNT, the JSON key of a service
      # account with the "Firebase Hosting Admin" role. Without it the deploy is skipped
      # with a notice instead of failing, so a fork or a fresh clone does not get a red X.
      - name: Check Firebase credentials
        id: creds
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::notice::FIREBASE_SERVICE_ACCOUNT is not set, skipping the deploy. Add it in Settings > Secrets and variables > Actions."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        if: steps.creds.outputs.enabled == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          key="$RUNNER_TEMP/firebase-key.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key"
          export GOOGLE_APPLICATION_CREDENTIALS="$key"
          trap 'rm -f "$key"' EXIT
          npx --yes firebase-tools@latest deploy --only hosting --project mirrorlabapp --non-interactive

      - name: Smoke-test the deployment
        if: steps.creds.outputs.enabled == 'true'
        run: |
          for path in / /en/ /sitemap.xml /robots.txt; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://mirrorlabapp.web.app$path")
            echo "$path -> HTTP $code"
            test "$code" = "200"
          done
