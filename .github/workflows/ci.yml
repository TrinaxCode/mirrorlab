name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  # The test-suite must never need a camera or a window.
  PYTEST_HEADLESS: "1"
  MIRRORLAB_MODELS: ${{ github.workspace }}/.model-cache

jobs:
  # -------------------------------------------------------------------------
  # Lint + tests on every supported OS. The app is explicitly cross-platform,
  # so the matrix is the feature: a regression that only shows up on Windows
  # is exactly what this job exists to catch.
  # -------------------------------------------------------------------------
  python:
    name: py${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        exclude:
          # macOS 14+ arm64 runners do not carry a 3.9 toolchain.
          - os: macos-latest
            python-version: "3.9"
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            coverage: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # mediapipe pulls the full OpenCV build, whose bundled Qt libraries need
      # libGL and friends at import time — the failure surfaces as a confusing
      # `import cv2` error, so install the runtime deps up front.
      # `libglib2.0-0` was renamed to `libglib2.0-0t64` on Ubuntu 24.04; the
      # fallback keeps this step valid on both 22.04 and 24.04.
      - name: Install OpenCV runtime libraries
        if: runner.os == 'Linux'
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0t64 libsm6 libxext6 libice6 libxrender1 libxcb1 \
            || sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 libsm6 libxext6 libice6 libxrender1 libxcb1

      - name: Install MirrorLab
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check src tests

      - name: Format check (black)
        run: python -m black --check --diff src tests

      - name: Tests
        run: >
          python -m pytest
          -m "not camera and not gui"
          --cov=mirrorlab
          --cov-report=term-missing
          ${{ matrix.coverage && '--cov-report=xml' || '' }}

      - name: Upload coverage
        if: matrix.coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  # -------------------------------------------------------------------------
  # The package must install from a clean environment and expose its CLI.
  # -------------------------------------------------------------------------
  package:
    name: Build & install the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Install the built wheel in a clean venv
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/python -m pip install dist/*.whl
          /tmp/verify/bin/mirrorlab --version
          /tmp/verify/bin/mirrorlab filters --json | head -c 200
          /tmp/verify/bin/python -c "import mirrorlab; print(mirrorlab.__version__)"

  # -------------------------------------------------------------------------
  # Web demo: type-check, unit tests and a production build.
  # -------------------------------------------------------------------------
  web:
    name: Web demo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - name: Report bundle size
        run: du -sh dist && ls -la dist/assets | head -20
